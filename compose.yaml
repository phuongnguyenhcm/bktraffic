services:
  mongo:
    image: mongo:7
    container_name: bktraffic-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  bktraffic-app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bktraffic-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      PORT: "3000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
